version: 0.2

env:
  variables:
    REPO_URL: "https://github.com/shamnitjsr/OnlineStoreRestAPI.git"
    BRANCH: "main"

phases:
  install:
    runtime-versions:
      java: corretto11            # JDK 11 (JavaToolInstaller@0)
    commands:
      - echo Setting up JDK and Maven...
      - java -version
      - mvn -version

  build:
    commands:
      - echo Building Maven project...
      - mvn -B clean compile
      - echo Executing Rest Assured API automation tests...
      - mvn -B clean test

  post_build:
    commands:
      - |
        if [ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ]; then
          echo "API automation execution completed successfully."
        else
          echo "API automation execution FAILED. Check the Test and Report stages."
        fi
      - echo "API automation pipeline execution completed."

# PublishTestResults@2 equivalent (runs even if tests fail)
reports:
  api-test-report:
    files:
      - '**/target/surefire-reports/*.xml'
    file-format: JUNITXML

# PublishPipelineArtifact@1 equivalent
artifacts:
  files:
    - '**/target/surefire-reports/**/*'
  name: surefire-reports