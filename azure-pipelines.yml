# Equivalent of the Jenkinsfile (Windows agent, JDK 11 + Maven)
trigger: none          # manual runs only, like the Jenkins job. Use "batch: true" CI trigger if you want push builds

resources:
  repositories:
    - repository: OnlineStoreRestAPI          # alias used by the checkout step
      type: github
      name: shamnitjsr/OnlineStoreRestAPI     # REPO_URL
      ref: refs/heads/main                    # BRANCH
      endpoint: github-connection             # GitHub service connection name

variables:
  REPO_URL: 'https://github.com/shamnitjsr/OnlineStoreRestAPI.git'
  BRANCH: 'main'

pool:
  vmImage: 'windows-latest'                   # Jenkins used 'bat', so a Windows agent

jobs:
  - job: ApiAutomation
    displayName: 'Rest Assured API Automation'
    timeoutInMinutes: 30                      # options { timeout(30 MINUTES) }
    steps:
      # ---------- Checkout ----------
      - checkout: OnlineStoreRestAPI
        displayName: 'Checkout'
        clean: true

      # ---------- Tools (jdk 'MyJava', maven 'MyMaven') ----------
      - task: JavaToolInstaller@0
        displayName: 'Setup JDK 11'
        inputs:
          versionSpec: '11'
          jdkArchitectureOption: 'x64'
          jdkSourceOption: 'PreInstalled'

      # ---------- Build ----------
      - script: |
          echo Building Maven project...
          java -version
          mvn -version
          mvn -B clean compile
        displayName: 'Build'

      # ---------- Test ----------
      - script: |
          echo Executing Rest Assured API automation tests...
          mvn -B clean test
        displayName: 'Test'

      # ---------- Report (runs even if tests fail) ----------
      - task: PublishTestResults@2
        displayName: 'Report - Publish test results'
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: 'JUnit'
          testResultsFiles: '**/target/surefire-reports/*.xml'
          searchFolder: '$(Build.SourcesDirectory)'
          failTaskOnMissingResultsFile: true  # allowEmptyResults: false
          testRunTitle: 'Rest Assured API Tests'

      - task: PublishPipelineArtifact@1
        displayName: 'Report - Archive surefire reports'
        condition: succeededOrFailed()
        inputs:
          targetPath: '$(Build.SourcesDirectory)'
          # Only the surefire reports are published
          artifact: 'surefire-reports'
          publishLocation: 'pipeline'
        # See note below on narrowing the path

      # ---------- post { success / failure / always } ----------
      - script: echo API automation execution completed successfully.
        displayName: 'Post - Success'
        condition: succeeded()

      - script: echo API automation execution FAILED. Check the Test and Report steps.
        displayName: 'Post - Failure'
        condition: failed()

      - script: echo Azure Pipelines API automation execution completed.
        displayName: 'Post - Always'
        condition: always()